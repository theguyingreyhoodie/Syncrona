<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - ProTask</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=3">
    <script src="js/theme.js"></script>
</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-header-left">
                    <div class="logo-icon"></div>
                    <h2>ProTask</h2>
                </div>
                <button class="close-sidebar-btn" onclick="toggleSidebar()">&times;</button>
            </div>
            <ul class="nav-links">
                <li onclick="go('dashboard.html')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    Dashboard
                </li>
                <li onclick="go('tasks.html')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 11 12 14 22 4"></polyline>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                    </svg>
                    Tasks
                </li>
                <li onclick="go('notes.html')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    Notes
                </li>
                <li class="active" onclick="go('calendar.html')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    Calendar
                </li>
                <li onclick="go('expenses.html')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="1" x2="12" y2="23"></line>
                        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                    </svg>
                    Expenses
                </li>
            </ul>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Logout
                </button>
            </div>
        </nav>

        <!-- MAIN -->
        <main class="main">
            <header class="top-header" style="margin-bottom: 20px;">
                <div style="display: flex; align-items: center;">
                    <button class="hamburger-btn" onclick="toggleSidebar()">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <div class="welcome-text">
                        <h1 class="gradient-text" style="font-size: 2rem;">Calendar</h1>
                        <p style="color: var(--text-secondary); margin-top: 5px;">Plan your month</p>
                    </div>
                </div>
            </header>

            <div class="glass-panel" style="margin-bottom: 30px;">
                <div class="calendar-header">
                    <button class="calendar-nav-btn" onclick="changeMonth(-1)">Previous</button>
                    <h2 id="monthYearDisplay">Loading...</h2>
                    <button class="calendar-nav-btn" onclick="changeMonth(1)">Next</button>
                </div>

                <div class="calendar-grid-header">
                    <div>Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>
                </div>

                <div id="calendarGrid" class="calendar-grid">
                    <!-- Days loaded via JS -->
                </div>
            </div>
        </main>

    </div>

    <!-- Add Task Modal -->
    <div class="modal-overlay" id="taskModal">
        <div class="modal-content large">
            <div class="modal-header">
                <h3 id="modalDateDisplayHeader">Loading...</h3>
                <button class="close-modal-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-split-layout">
                <!-- Left Box: Existing Items -->
                <div class="existing-items-box">
                    <h4>Existing Items</h4>
                    <div id="modalExistingItems" class="existing-items-list">
                        <!-- Items injected via JS -->
                    </div>
                </div>

                <!-- Right Box: Add Item Form -->
                <div class="add-item-box">
                    <h4>Add New Item</h4>
                    <div class="task-input" style="flex-wrap: wrap; gap: 10px;">
                        <input type="text" id="modalTaskTitle" placeholder="I need to..." style="flex: 1 1 100%;">
                        <input type="number" id="modalExpenseAmount" placeholder="Amount ($ if expense)"
                            style="flex: 1 1 100%;">
                        <input type="hidden" id="modalDueDate">
                        <p id="modalDateDisplay" style="display: none;"></p>
                    </div>
                    <div style="display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap;">
                        <button class="btn-primary" onclick="addCalendarTask()" style="flex: 1;">Save Task</button>
                        <button class="btn-primary" onclick="addCalendarEvent()"
                            style="flex: 1; background: linear-gradient(135deg, #ec4899, #f472b6); box-shadow: 0 0 20px rgba(236,72,153,0.3);">Save
                            Event</button>
                        <button class="btn-primary" onclick="addCalendarExpense()"
                            style="flex: 1; background: linear-gradient(135deg, #ef4444, #f87171); box-shadow: 0 0 20px rgba(239,68,68,0.3);">Save
                            Expense</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            if (window.innerWidth <= 768) {
                document.body.classList.toggle('sidebar-open');
            } else {
                document.body.classList.toggle('sidebar-closed');
            }
        }
    </script>
    <script src="js/calendar.js"></script>
</body>

</html>
