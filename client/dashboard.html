<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity Dashboard</title>
    <meta name="description" content="Manage your tasks, notes, and events with our premium productivity dashboard.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=4">
    <script src="js/theme.js"></script>
</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-header-left">
                    <div class="logo-icon"></div>
                    <h2>ProTask</h2>
                </div>
                <button class="close-sidebar-btn" onclick="toggleSidebar()">&times;</button>
            </div>
            <ul class="nav-links">
                <li class="active" onclick="go('dashboard.html')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    Dashboard
                </li>
                <li onclick="go('tasks.html')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 11 12 14 22 4"></polyline>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                    </svg>
                    Tasks
                </li>
                <li onclick="go('notes.html')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    Notes
                </li>
                <li onclick="go('calendar.html')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    Calendar
                </li>
                <li onclick="go('expenses.html')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="1" x2="12" y2="23"></line>
                        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                    </svg>
                    Expenses
                </li>
                <li onclick="go('settings.html')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    Settings
                </li>
            </ul>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Logout
                </button>
            </div>
        </nav>

        <!-- MAIN CONTENT -->
        <main class="main">
            <header class="top-header">
                <div style="display: flex; align-items: center;">
                    <button class="hamburger-btn" onclick="toggleSidebar()">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <div class="welcome-text">
                        <h1 id="greeting">Welcome back,</h1>
                        <p id="username" class="gradient-text"></p>
                    </div>
                </div>
                <div class="user-profile" style="display: flex; align-items: center; gap: 16px;">
                    <button id="themeToggleBtn" onclick="toggleTheme()" class="theme-toggle" aria-label="Toggle Theme" style="background: transparent; border: none; cursor: pointer; color: var(--text-primary); display: flex; box-shadow: none;">
                        <svg class="theme-toggle-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                    <div class="avatar" title="Profile Settings"></div>
                </div>
            </header>

            <section class="dashboard-stats">
                <div class="stat-card" onclick="go('tasks.html')">
                    <div class="stat-icon task-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 11 12 14 22 4"></polyline>
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <h3>Today's Tasks</h3>
                        <p class="stat-value" id="dashboardTasksStat">Loading...</p>
                    </div>
                </div>
                <div class="stat-card" onclick="go('notes.html')">
                    <div class="stat-icon note-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <h3>Recent Notes</h3>
                        <p class="stat-value" id="dashboardNotesStat">Loading...</p>
                    </div>
                </div>
                <div class="stat-card" onclick="go('calendar.html')">
                    <div class="stat-icon event-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <h3>Upcoming Events</h3>
                        <p class="stat-value" id="dashboardEventsStat">0 This Week</p>
                    </div>
                </div>
            </section>

            <div style="margin-top: 40px; text-align: center; padding: 20px;">
                <p id="dailyTip" style="color: var(--text-secondary); font-size: 0.95rem; line-height: 1.5; font-style: italic; margin: 0; transition: opacity 0.5s ease;">Loading tip...</p>
            </div>
        </main>

        <!-- Floating Notes FAB -->
        <button class="fab-notes" id="fabNotes" onclick="toggleNotesPopup()">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
        </button>

        <!-- Notes Pop-up Container -->
        <div class="notes-popup-container" id="notesPopup">
            <div class="notes-header">
                <h3>Quick Notes</h3>
                <button class="close-notes-btn" onclick="toggleNotesPopup()">&times;</button>
            </div>
            <div class="notes-body" id="popupNotesList">
                <p style="color: var(--text-secondary); text-align: center; font-size: 0.9rem;">Loading notes...</p>
            </div>
            <div class="notes-footer">
                <textarea class="notes-textarea" id="newNoteContent" placeholder="Type a new note here..."></textarea>
                <button class="btn-primary" onclick="addPopupNote()"
                    style="width: 100%; padding: 10px; border-radius: 8px;">Save Note</button>
            </div>
        </div>

    </div>

    <script>
        // Authentication check mechanism
        if (!localStorage.getItem("token")) {
            // Mock user for local visual demonstration purposes
            localStorage.setItem("user", JSON.stringify({ name: "Creator" }));
            localStorage.setItem("token", "demo-token");
            // In production:
            // window.location.href="login.html";
        }

        let user = null;
        try {
            user = JSON.parse(localStorage.getItem("user"));
        } catch (e) { }

        if (user && user.name) {
            document.getElementById("username").innerText = user.name + "!";
        } else {
            document.getElementById("username").innerText = "Guest!";
        }

        // Dynamic greeting based on time of day
        function updateGreeting() {
            const hour = new Date().getHours();
            let greeting = "Good evening,";
            if (hour >= 5 && hour < 12) greeting = "Good morning,";
            else if (hour >= 12 && hour < 17) greeting = "Good afternoon,";
            document.getElementById("greeting").innerText = greeting;
        }
        updateGreeting();

        function logout() {
            localStorage.clear();
            window.location.href = "login.html";
        }

        function go(page) {
            window.location.href = page;
        }

        function toggleSidebar() {
            if (window.innerWidth <= 768) {
                document.body.classList.toggle('sidebar-open');
            } else {
                document.body.classList.toggle('sidebar-closed');
            }
        }

        function escapeHTML(str) {
            if (!str) return "";
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        function timeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + " years ago";
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + " months ago";
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + " days ago";
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + " hours ago";
            interval = seconds / 60;
            if (interval > 1) return Math.floor(interval) + " minutes ago";
            if (seconds < 30) return "Just now";
            return Math.floor(seconds) + " seconds ago";
        }

        async function loadDashboardStats() {
            const fetchOpts = { headers: { "Authorization": "Bearer " + tokenAuth }, cache: "no-store" };
            let recentItems = [];

            try {
                // Fetch Tasks Count
                const TASKS_API = "http://localhost:5000/api/tasks";
                const tasksRes = await fetch(TASKS_API, fetchOpts);
                if (tasksRes.ok) {
                    const tasks = await tasksRes.json();
                    const pendingTasks = tasks.filter(t => !t.completed).length;
                    document.getElementById("dashboardTasksStat").innerText = pendingTasks + " Pending";
                    tasks.forEach(t => recentItems.push({ type: 'task', title: t.title, date: new Date(t.createdAt) }));
                } else {
                    document.getElementById("dashboardTasksStat").innerText = "0 Pending";
                }
            } catch (e) {
                document.getElementById("dashboardTasksStat").innerText = "0 Pending";
            }

            try {
                // Fetch Notes Count
                const notesRes = await fetch(NOTES_API, fetchOpts);
                if (notesRes.ok) {
                    const notes = await notesRes.json();
                    document.getElementById("dashboardNotesStat").innerText = notes.length + " Saved";
                    notes.forEach(n => {
                        let shortTitle = n.content.split('\n')[0].substring(0, 25);
                        if (n.content.length > 25) shortTitle += '...';
                        recentItems.push({ type: 'note', title: shortTitle, date: new Date(n.createdAt) });
                    });
                } else {
                    document.getElementById("dashboardNotesStat").innerText = "0 Saved";
                }
            } catch (e) {
                document.getElementById("dashboardNotesStat").innerText = "0 Saved";
            }

            try {
                // Fetch Events Count
                const EVENTS_API = "http://localhost:5000/api/events";
                const eventsRes = await fetch(EVENTS_API, fetchOpts);
                if (eventsRes.ok) {
                    const events = await eventsRes.json();

                    const now = new Date();
                    now.setHours(0, 0, 0, 0);
                    const nextWeek = new Date(now);
                    nextWeek.setDate(now.getDate() + 7);

                    const upcoming = events.filter(e => {
                        const d = new Date(e.date);
                        return d >= now && d <= nextWeek;
                    });

                    document.getElementById("dashboardEventsStat").innerText = upcoming.length + " This Week";

                    events.forEach(e => {
                        recentItems.push({ type: 'event', title: e.title, date: new Date(e.createdAt) });
                    });
                } else {
                    document.getElementById("dashboardEventsStat").innerText = "0 This Week";
                }
            } catch (e) {
                document.getElementById("dashboardEventsStat").innerText = "0 This Week";
            }

        }

        /* --- Quick Notes Feature --- */
        const NOTES_API = "http://localhost:5000/api/notes";
        const tokenAuth = localStorage.getItem("token") || "demo-token";
        let popupNotes = [];

        loadDashboardStats();

        function toggleNotesPopup() {
            const popup = document.getElementById("notesPopup");
            const isOpen = popup.classList.contains("open");

            if (!isOpen) {
                popup.classList.add("open");
                loadPopupNotes();
            } else {
                popup.classList.remove("open");
            }
        }

        async function loadPopupNotes() {
            const list = document.getElementById("popupNotesList");
            try {
                const res = await fetch(NOTES_API, {
                    headers: { "Authorization": "Bearer " + tokenAuth }
                });
                if (res.ok) {
                    popupNotes = await res.json();
                    renderPopupNotes();
                } else {
                    list.innerHTML = `<p style="color: #ef4444; font-size: 0.9rem;">Failed to load.</p>`;
                }
            } catch (e) {
                list.innerHTML = `<p style="color: #ef4444; font-size: 0.9rem;">Backend offline</p>`;
            }
        }

        function renderPopupNotes() {
            const list = document.getElementById("popupNotesList");
            list.innerHTML = "";
            if (popupNotes.length === 0) {
                list.innerHTML = `<p style="color: var(--text-secondary); text-align: center; font-size: 0.9rem;">No notes yet.</p>`;
                return;
            }

            popupNotes.forEach(note => {
                list.innerHTML += `
                <div class="note-item">
                    <div class="note-content">${note.content}</div>
                    <button class="delete-note-btn" onclick="deletePopupNote('${note._id}')">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    </button>
                </div>`;
            });
        }

        async function addPopupNote() {
            const content = document.getElementById("newNoteContent").value.trim();
            if (!content) return;
            try {
                await fetch(NOTES_API, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + tokenAuth },
                    body: JSON.stringify({ content })
                });
                document.getElementById("newNoteContent").value = "";
                loadPopupNotes();
                loadDashboardStats(); // Refresh dashboard numbers
            } catch (e) { console.error("Could not save note"); }
        }

        async function deletePopupNote(id) {
            try {
                await fetch(NOTES_API + "/" + id, {
                    method: "DELETE",
                    headers: { "Authorization": "Bearer " + tokenAuth }
                });
                loadPopupNotes();
                loadDashboardStats(); // Refresh dashboard numbers
            } catch (e) { console.error("Could not delete note"); }
        }

        /* --- Productivity Tips --- */
        const productivityTips = [
            "Start your day by tackling the most difficult task first.",
            "Use the Pomodoro Technique: Work for 25 minutes, then take a 5-minute break.",
            "Take regular breaks to rest your eyes and stretch your legs.",
            "Break large tasks into smaller, manageable chunks.",
            "Eliminate distractions by turning off notifications during deep work.",
            "Stay hydrated and maintain a healthy sleep schedule.",
            "Review your goals at the end of each day to prepare for tomorrow.",
            "Keep your workspace clean. A cluttered desk leads to a cluttered mind."
        ];

        function generateNewTip() {
            const tipEl = document.getElementById("dailyTip");
            if (tipEl) {
                const randomTip = productivityTips[Math.floor(Math.random() * productivityTips.length)];
                tipEl.style.opacity = 0;
                setTimeout(() => {
                    tipEl.innerText = '"' + randomTip + '"';
                    tipEl.style.opacity = 1;
                }, 500);
            }
        }
        
        generateNewTip();
        setInterval(generateNewTip, 15000);
    </script>

</body>

</html>
