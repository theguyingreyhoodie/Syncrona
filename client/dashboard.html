<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Today · Syncrona</title>
    <meta name="description" content="Your day as a timetable: tasks, events and spending in one place.">
    <script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;if(!localStorage.getItem("token"))location.replace("login.html")}catch(e){}</script>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
    <script src="js/dashboard.js" defer></script>
</head>
<body data-page="today" data-auth="required">
    <div class="app">
        <nav class="rail" id="rail" aria-label="Main"></nav>
        <main class="main" id="main">
            <div class="page">
                <header class="page-head">
                    <div>
                        <h1 class="page-title" id="todayTitle">Today</h1>
                        <p class="page-sub" id="greeting">&nbsp;</p>
                    </div>
                    <p class="clock" id="clock" aria-label="Current time"></p>
                </header>

                <form class="addbar" id="addbar" novalidate>
                    <fieldset class="seg">
                        <legend class="sr-only">What are you adding?</legend>
                        <label><input type="radio" name="kind" value="task" checked><span>Task</span></label>
                        <label><input type="radio" name="kind" value="event"><span>Event</span></label>
                        <label><input type="radio" name="kind" value="spend"><span>Expense</span></label>
                    </fieldset>
                    <div class="field title-field">
                        <label class="sr-only" for="qaTitle">Title</label>
                        <input class="input" id="qaTitle" placeholder="Add a task…" autocomplete="off" maxlength="200">
                    </div>
                    <div class="field">
                        <label class="sr-only" for="qaDate">Date</label>
                        <input class="input" type="date" id="qaDate">
                    </div>
                    <div class="field" id="qaTimeField">
                        <label class="sr-only" for="qaTime">Time (optional)</label>
                        <input class="input" type="time" id="qaTime" title="Time (optional)">
                    </div>
                    <div class="field money-input" id="qaAmountField" hidden>
                        <label class="sr-only" for="qaAmount">Amount in rupees</label>
                        <input class="input" type="number" id="qaAmount" min="0" step="0.01" inputmode="decimal" placeholder="Amount">
                    </div>
                    <button class="btn btn-primary" type="submit" id="qaSubmit"></button>
                    <p class="form-error" id="qaError" role="alert"></p>
                </form>

                <div class="today-grid">
                    <section aria-labelledby="nextHead">
                        <div class="section-head">
                            <h2 class="section-title" id="nextHead">Next up</h2>
                            <span class="section-meta" id="nextMeta"></span>
                        </div>
                        <div id="board">
                            <div class="skeleton-rows" aria-hidden="true">
                                <div><i class="skeleton" style="width:56px"></i><i class="skeleton" style="width:26px"></i><i class="skeleton" style="width:46%"></i></div>
                                <div><i class="skeleton" style="width:56px"></i><i class="skeleton" style="width:26px"></i><i class="skeleton" style="width:58%"></i></div>
                                <div><i class="skeleton" style="width:56px"></i><i class="skeleton" style="width:26px"></i><i class="skeleton" style="width:38%"></i></div>
                                <div><i class="skeleton" style="width:56px"></i><i class="skeleton" style="width:26px"></i><i class="skeleton" style="width:52%"></i></div>
                            </div>
                        </div>
                    </section>

                    <aside class="aside">
                        <section aria-labelledby="spendHead">
                            <div class="section-head">
                                <h2 class="section-title" id="spendHead">This month</h2>
                                <span class="section-meta"><a href="expenses.html">Expenses</a></span>
                            </div>
                            <div id="spend"><i class="skeleton" style="width:60%;height:40px"></i></div>
                        </section>
                        <section aria-labelledby="notesHead">
                            <div class="section-head">
                                <h2 class="section-title" id="notesHead">Notes</h2>
                                <span class="section-meta"><a href="notes.html">All notes</a></span>
                            </div>
                            <div id="notes"></div>
                        </section>
                    </aside>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
