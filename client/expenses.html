<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Expenses · Syncrona</title>
    <meta name="description" content="Spending by month, day by day.">
    <script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;if(!localStorage.getItem("token"))location.replace("login.html")}catch(e){}</script>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
    <script src="js/expenses.js" defer></script>
</head>
<body data-page="expenses" data-auth="required">
    <div class="app">
        <nav class="rail" id="rail" aria-label="Main"></nav>
        <main class="main" id="main">
            <div class="page">
                <header class="page-head">
                    <div>
                        <h1 class="page-title">Expenses</h1>
                        <p class="page-sub" id="allTime">&nbsp;</p>
                    </div>
                    <div class="cal-nav">
                        <button class="icon-btn" type="button" id="prevMonth" aria-label="Previous month"></button>
                        <span class="section-title" id="monthLabel" style="min-width:132px;text-align:center" aria-live="polite"></span>
                        <button class="icon-btn" type="button" id="nextMonth" aria-label="Next month"></button>
                    </div>
                </header>

                <div class="money-summary" id="summary"></div>

                <form class="addbar no-type" id="addExpense" novalidate>
                    <div class="field title-field">
                        <label class="sr-only" for="exTitle">What was it for?</label>
                        <input class="input" id="exTitle" placeholder="What did you pay for?" autocomplete="off" maxlength="200">
                    </div>
                    <div class="field money-input">
                        <label class="sr-only" for="exAmount">Amount in rupees</label>
                        <input class="input" type="number" id="exAmount" min="0" step="0.01" inputmode="decimal" placeholder="Amount">
                    </div>
                    <div class="field">
                        <label class="sr-only" for="exDate">Date</label>
                        <input class="input" type="date" id="exDate">
                    </div>
                    <button class="btn btn-primary" type="submit" id="exSubmit"></button>
                    <p class="form-error" id="exError" role="alert"></p>
                </form>

                <div class="section-head">
                    <h2 class="section-title" id="listHead">Payments</h2>
                    <span class="section-meta" id="listMeta"></span>
                </div>
                <div id="list">
                    <div class="skeleton-rows" aria-hidden="true">
                        <div><i class="skeleton" style="width:40%"></i></div>
                        <div><i class="skeleton" style="width:55%"></i></div>
                        <div><i class="skeleton" style="width:30%"></i></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
