<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses - ProTask</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=3">
    <style>
        .expense-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-bottom: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .expense-info h4 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        .expense-info p {
            margin: 5px 0 0 0;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .expense-amount {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ef4444;
            /* red for expense */
        }

        .expense-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .total-box {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(248, 113, 113, 0.05));
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
        }

        .total-box h3 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--text-secondary);
        }

        .total-box .total-amount {
            font-size: 2.5rem;
            font-weight: 800;
            color: #ef4444;
            margin-top: 10px;
        }
    </style>
    <script src="js/theme.js"></script>
</head>

<body>
    <div class="app">
        <!-- SIDEBAR -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-header-left">
                    <div class="logo-icon"></div>
                    <h2>ProTask</h2>
                </div>
                <button class="close-sidebar-btn" onclick="toggleSidebar()">&times;</button>
            </div>
            <ul class="nav-links">
                <li onclick="go('dashboard.html')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    Dashboard
                </li>
                <li onclick="go('tasks.html')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 11 12 14 22 4"></polyline>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                    </svg>
                    Tasks
                </li>
                <li onclick="go('notes.html')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    Notes
                </li>
                <li onclick="go('calendar.html')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    Calendar
                </li>
                <li class="active" onclick="go('expenses.html')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="1" x2="12" y2="23"></line>
                        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                    </svg>
                    Expenses
                </li>
            </ul>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Logout
                </button>
            </div>
        </nav>

        <!-- MAIN -->
        <main class="main">
            <header class="top-header">
                <div style="display: flex; align-items: center;">
                    <button class="hamburger-btn" onclick="toggleSidebar()">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <div class="welcome-text">
                        <h1 class="gradient-text" style="font-size: 2rem;">Expenses</h1>
                        <p style="color: var(--text-secondary); margin-top: 5px;">Track your spending</p>
                    </div>
                </div>
            </header>

            <div class="total-box">
                <h3>Total Expenses</h3>
                <div class="total-amount" id="totalAmount">₹0.00</div>
            </div>

            <div class="task-input glass-panel">
                <input type="text" id="expenseTitle" placeholder="Expense description..." style="flex: 2;">
                <input type="number" id="expenseAmount" placeholder="Amount (₹)" style="flex: 1;">
                <input type="date" id="expenseDate" style="flex: 1;">
                <button class="add-btn" onclick="addExpense()">Add</button>
            </div>

            <div class="glass-panel" style="margin-top: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
                <div>
                    <h3 style="margin: 0; font-size: 1rem; color: var(--text-primary);">High Expense Threshold</h3>
                    <p style="margin: 5px 0 0 0; font-size: 0.85rem; color: var(--text-secondary);">Amounts at or above this value will be highlighted red on your calendar.</p>
                </div>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="number" id="expenseThresholdInput" placeholder="e.g. 500" style="max-width: 150px; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-primary); color: var(--text-primary);">
                    <button class="btn-secondary" onclick="saveThreshold()">Save Bracket</button>
                </div>
            </div>

            <div class="glass-panel" style="margin-top: 20px;">
                <h2 style="margin-bottom: 15px; font-size: 1.25rem;">History</h2>
                <div id="expensesList">
                    <p style="color: var(--text-secondary); text-align: center; padding: 20px;">Loading expenses...</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        function toggleSidebar() {
            if (window.innerWidth <= 768) {
                document.body.classList.toggle('sidebar-open');
            } else {
                document.body.classList.toggle('sidebar-closed');
            }
        }
    </script>
    <script src="js/expenses.js"></script>
</body>

</html>
