<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ProTask</title>
    <script>
        // Redirect based on whether the user is logged in
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('token')) {
                window.location.href = 'dashboard.html';
            } else {
                window.location.href = 'login.html';
            }
        });
    </script>
</head>
<body style="background: #f8fafc; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; color: #475569;">
    <h2>Redirecting...</h2>
</body>
</html>
