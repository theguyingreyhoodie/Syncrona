<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notes · Syncrona</title>
    <meta name="description" content="Everything you've jotted down.">
    <script>try{var p=localStorage.getItem("palette");if(p)document.documentElement.dataset.palette=p;if(!localStorage.getItem("token"))location.replace("login.html")}catch(e){}</script>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Instrument+Serif&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
    <script src="js/notes.js" defer></script>
</head>
<body data-page="notes" data-auth="required">
    <div class="app">
        <nav class="sidebar" id="rail" aria-label="Main"></nav>
        <main class="main" id="main">
            <div class="page">
                <header class="page-head">
                    <div>
                        <h1 class="page-title">Notes</h1>
                        <p class="page-sub" id="noteCount">&nbsp;</p>
                    </div>
                </header>

                <div class="notes-app" id="notesApp">
                    <aside class="panel notes-list-pane" aria-label="All notes">
                        <div class="nl-head">
                            <div class="search">
                                <span id="searchIcon"></span>
                                <label class="sr-only" for="search">Search notes</label>
                                <input class="input" type="search" id="search" placeholder="Search" autocomplete="off">
                            </div>
                            <button class="btn btn-primary" type="button" id="newNoteBtn"></button>
                        </div>
                        <ul class="note-list" id="noteList">
                            <li class="skeleton-item"><i class="skeleton" style="width:70%"></i><i class="skeleton" style="width:45%"></i></li>
                            <li class="skeleton-item"><i class="skeleton" style="width:60%"></i><i class="skeleton" style="width:35%"></i></li>
                        </ul>
                    </aside>
                    <section class="panel note-pane" id="notePane" aria-label="Note"></section>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
