<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tasks · Syncrona</title>
    <meta name="description" content="Every task with its due date and status.">
    <script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;var a=localStorage.getItem("accent");if(a)document.documentElement.dataset.accent=a;if(!localStorage.getItem("token"))location.replace("login.html")}catch(e){}</script>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Instrument+Serif&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
    <script src="js/tasks.js" defer></script>
</head>
<body data-page="tasks" data-auth="required">
    <div class="app">
        <nav class="sidebar" id="rail" aria-label="Main"></nav>
        <main class="main" id="main">
            <div class="page">
                <header class="page-head">
                    <div>
                        <h1 class="page-title">Tasks</h1>
                        <p class="page-sub" id="taskSummary">&nbsp;</p>
                    </div>
                    <div class="page-actions">
                        <fieldset class="seg" id="filter">
                            <legend class="sr-only">Show</legend>
                            <label><input type="radio" name="filter" value="open" checked><span>Open <span class="count" data-count="open"></span></span></label>
                            <label><input type="radio" name="filter" value="done"><span>Done <span class="count" data-count="done"></span></span></label>
                            <label><input type="radio" name="filter" value="all"><span>All <span class="count" data-count="all"></span></span></label>
                        </fieldset>
                    </div>
                </header>

                <form class="composer-row" id="addTask" novalidate>
                    <div class="grow">
                        <label class="sr-only" for="taskTitle">Task</label>
                        <input class="input" id="taskTitle" placeholder="What needs doing?" autocomplete="off" maxlength="200">
                    </div>
                    <div class="w-date">
                        <label class="sr-only" for="taskDate">Due date (optional)</label>
                        <input class="input" type="date" id="taskDate" title="Due date (optional)">
                    </div>
                    <div class="w-time">
                        <label class="sr-only" for="taskTime">Due time (optional)</label>
                        <input class="input" type="time" id="taskTime" title="Due time (optional)">
                    </div>
                    <button class="btn btn-primary" type="submit" id="taskSubmit"></button>
                    <p class="form-error" id="taskError" role="alert"></p>
                </form>

                <section class="panel" style="margin-top:16px" aria-label="Task list">
                    <div id="list">
                        <div class="list" aria-hidden="true">
                            <div class="skeleton-item"><i class="skeleton" style="width:48%"></i></div>
                            <div class="skeleton-item"><i class="skeleton" style="width:36%"></i></div>
                            <div class="skeleton-item"><i class="skeleton" style="width:55%"></i></div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>
</body>
</html>
